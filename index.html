<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to me Bot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Talk to me Bot</h1>
            <p>Your hands-free AI companion</p>
        </header>

        <main>
            <div id="status-container">
                <div id="status-indicator"></div>
                <span id="status-text">Click 'Start' to begin</span>
            </div>

            <div id="conversation-log">
                <!-- Messages will be appended here -->
            </div>

            <div id="controls">
                <button id="start-btn">Start</button>
                <button id="stop-btn" style="display: none;">Stop</button>
            </div>
        </main>

        <footer>
            <div id="settings">
                <label for="tts-toggle">Use ElevenLabs TTS:</label>
                <label class="switch">
                    <input type="checkbox" id="tts-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </footer>
    </div>
    
    <script type="importmap">
    {
        "imports": {}
    }
    </script>

</body>
</html>
